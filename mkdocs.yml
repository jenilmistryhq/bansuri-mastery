site_name: Bansuri Mastery
site_description: A practical, research-based learning system for the Indian bamboo flute, from zero to independent musicianship.
site_url: !ENV [SITE_URL, "https://jenilmistryhq.github.io/bansuri-mastery/docs/"]
repo_url: https://github.com/jenilmistryhq/bansuri-mastery
repo_name: jenilmistryhq/bansuri-mastery
edit_uri: edit/main/bansuri-mastery/
copyright: Content CC BY-NC-SA 4.0 &middot; Code MIT &middot; Copyright &copy; 2026 Jenil Mistry
docs_dir: bansuri-mastery
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  font:
    text: Hind
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - def_list
  - footnotes
  - sane_lists
  - pymdownx.superfences
  - pymdownx.tilde
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

exclude_docs: |
  /tools/interactive-flute.html

