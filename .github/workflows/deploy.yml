name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install tools
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Lint JavaScript
        run: npx eslint .

      - name: Validate curriculum (links, IDs, typography)
        run: python scripts/validate.py

      - name: Raga grammar (no notes a raga leaves out)
        run: python scripts/raga_lint.py

      - name: Check generated files are up to date
        run: |
          python scripts/gen_nav.py --check
          python scripts/build_bench.py --check
          python scripts/build_plan.py --check
          python scripts/build_app.py --check
          python scripts/review_claims.py --check
          python scripts/build_voice.py --check
          python scripts/size_budget.py

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.shard == 1
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install tools
        run: |
          if [ ${{ matrix.shard }} -eq 1 ]; then pip install -r requirements.txt; fi
          npm ci

      - name: Cache the WebKit browser
        if: matrix.shard == 1
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-1.48.2

      - name: Install WebKit browser
        if: matrix.shard == 1
        run: npx playwright-core install --with-deps webkit

      - name: Unit tests
        if: matrix.shard == 1
        run: |
          node tests/core.test.mjs
          node tests/live.test.mjs
          node tests/plan.test.mjs
          node tests/transcribe.test.mjs

      - name: Browser smoke test
        env:
          CHROME_PATH: /usr/bin/google-chrome
          WALK_SHARD: ${{ matrix.shard }}/4
        run: node tests/smoke.mjs

      - name: Notation from real recordings
        if: matrix.shard == 1
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/transcribe-real.mjs

      - name: Safari engine (WebKit) test
        if: matrix.shard == 1
        run: node tests/webkit.mjs

      - name: Assemble site (app at /, reference site at /docs/)
        if: matrix.shard == 1
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then unset SITE_URL; fi
          mkdir -p _site
          mkdocs build --strict -d _site/docs
          cp -r index.html manifest.webmanifest sw.js app bansuri-mastery _site/
          touch _site/.nojekyll

      - name: Smoke test the assembled site
        if: matrix.shard == 1
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SITE_ROOT: _site
          WALK_ONLY: m0
        run: node tests/smoke.mjs

      - uses: actions/upload-pages-artifact@v3
        if: matrix.shard == 1
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
