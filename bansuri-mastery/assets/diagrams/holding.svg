<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d">
  <title id="t">Holding the flute and covering the holes</title>
  <desc id="d">Top view of a right-pointing hold: the blowing hole is at the left; holes 1 to 3 are covered by the left hand's index, middle and ring fingers, holes 4 to 6 by the right hand's index, middle and ring fingers; both thumbs support the flute from underneath. Side view of one finger: the soft pad covers the hole, not the fingertip.</desc>
  <style>
    text { font-family: Hind, "Segoe UI", system-ui, sans-serif; fill: #1b2420; }
    .small { font-size: 14px; } .label { font-size: 16px; font-weight: 600; } .muted { fill: #56645d; } .num { font-size: 14px; font-weight: 600; fill: #f6f3ea; }
  </style>
  <rect x="0" y="0" width="760" height="380" rx="16" fill="#f6f3ea"/>
  <text x="24" y="34" class="label">Top view (blowing hole on the left, flute pointing right)</text>

  <!-- flute -->
  <rect x="40" y="96" width="680" height="40" rx="20" fill="#c9a552" stroke="#8d6b22" stroke-width="2"/>
  <line x1="120" y1="96" x2="120" y2="136" stroke="#8d6b22" stroke-width="3"/>
  <line x1="520" y1="96" x2="520" y2="136" stroke="#8d6b22" stroke-width="3"/>
  <ellipse cx="90" cy="116" rx="11" ry="8" fill="#2b1d0e"/>
  <text x="90" y="160" class="small" text-anchor="middle">blowing hole</text>
  <text x="90" y="82" class="small" text-anchor="middle">lips here</text>

  <!-- holes 1-6 with finger pads -->
  <g>
    <circle cx="270" cy="116" r="15" fill="#b97a5b" stroke="#8a5638" stroke-width="2"/><text x="270" y="121" class="num" text-anchor="middle">1</text>
    <circle cx="320" cy="116" r="15" fill="#b97a5b" stroke="#8a5638" stroke-width="2"/><text x="320" y="121" class="num" text-anchor="middle">2</text>
    <circle cx="370" cy="116" r="15" fill="#b97a5b" stroke="#8a5638" stroke-width="2"/><text x="370" y="121" class="num" text-anchor="middle">3</text>
    <circle cx="450" cy="116" r="15" fill="#b97a5b" stroke="#8a5638" stroke-width="2"/><text x="450" y="121" class="num" text-anchor="middle">4</text>
    <circle cx="500" cy="116" r="15" fill="#b97a5b" stroke="#8a5638" stroke-width="2"/><text x="500" y="121" class="num" text-anchor="middle">5</text>
    <circle cx="550" cy="116" r="15" fill="#b97a5b" stroke="#8a5638" stroke-width="2"/><text x="550" y="121" class="num" text-anchor="middle">6</text>
  </g>
  <text x="270" y="78" class="small" text-anchor="middle">index</text>
  <text x="320" y="78" class="small" text-anchor="middle">middle</text>
  <text x="370" y="78" class="small" text-anchor="middle">ring</text>
  <text x="450" y="78" class="small" text-anchor="middle">index</text>
  <text x="500" y="78" class="small" text-anchor="middle">middle</text>
  <text x="550" y="78" class="small" text-anchor="middle">ring</text>
  <path d="M255,170 H385" stroke="#0d6a6e" stroke-width="3"/><text x="320" y="190" class="small" text-anchor="middle">left hand</text>
  <path d="M435,170 H565" stroke="#0d6a6e" stroke-width="3"/><text x="500" y="190" class="small" text-anchor="middle">right hand</text>
  <text x="320" y="210" class="small muted" text-anchor="middle">thumb underneath,</text>
  <text x="320" y="228" class="small muted" text-anchor="middle">below holes 1-2</text>
  <text x="500" y="210" class="small muted" text-anchor="middle">thumb underneath,</text>
  <text x="500" y="228" class="small muted" text-anchor="middle">below holes 4-5</text>
  <text x="736" y="270" class="small muted" text-anchor="end">Left-handed players may mirror this (L02).</text>

  <!-- finger pad -->
  <text x="24" y="276" class="label">One finger, side view</text>
  <rect x="24" y="330" width="300" height="18" rx="4" fill="#c9a552" stroke="#8d6b22" stroke-width="2"/>
  <rect x="144" y="330" width="40" height="18" fill="#2b1d0e"/>
  <path d="M64,300 C104,290 174,292 204,312 C216,320 210,330 194,331 L124,331 C94,331 64,322 64,300 Z" fill="#c98973" stroke="#8f5d42" stroke-width="2"/>
  <path d="M162,298 C184,296 200,302 206,312" fill="none" stroke="#8f5d42" stroke-width="2"/>
  <text x="352" y="318" class="small">The soft pad covers the hole, not the fingertip.</text>
  <text x="352" y="338" class="small muted">Flat, relaxed fingers seal best (L02, TS-06).</text>
</svg>
