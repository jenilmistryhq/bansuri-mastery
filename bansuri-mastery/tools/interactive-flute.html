    while (st.next < c.currentTime + 0.25) {
      const src = c.createBufferSource(); src.buffer = bufs()[st.step];
      const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3200;

  return {
    start() {
      if (st.on) return;

      st.on = true; st.next = c.currentTime + 0.1; st.step = 0; bufs();

    stop() {

    setFirst(k) { st.first = k; st.key = ""; },
    setSpeed(x) { st.speed = Math.max(0.3, Math.min(2, Number(x) || 1)); },
    setLevel(x) { st.level = Math.max(0, Math.min(1, Number(x))); if (st.gain) st.gain.gain.value = st.level * 0.9; },
    onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }

})();

function noteAt(str, i) {
  let low = 0; while (str[i] === ".") { low++; i++; }
  const L = str[i]; if (!(L in SEMI)) return null; i++;
  let high = 0; while (str[i] === "'") { high++; i++; }
  return { semi: SEMI[L] + 12 * (high - low), next: i };
}

function parseNotation(text) {
  const tokens = [], skipped = [];
  String(text || "").split(/\s+/).filter(Boolean).forEach(raw => {
    if (/^\|+$/.test(raw)) { tokens.push({ type: "bar", text: raw }); return; }
    if (raw === ",") { tokens.push({ type: "breath", text: "," }); return; }
    if (!/^[.SrRgGmMPdDnN'\-_{}~()^,|]+$/.test(raw)) { skipped.push(raw); tokens.push({ type: "skip", text: raw }); return; }
    const items = []; let i = 0, kan = null, glide = false, breathAfter = false;
    while (i < raw.length) {
      const ch = raw[i];
      if (ch === "{") {
        const j = raw.indexOf("}", i);
        const k = noteAt(j > i ? raw.slice(i + 1, j) : "", 0);
        kan = k ? k.semi : null; i = j > i ? j + 1 : raw.length; continue;
      }
      if (ch === "(" || ch === ")" || ch === "|") { i++; continue; }
      if (ch === "~") { glide = true; i++; continue; }
      if (ch === "-") { items.push({ hold: true }); i++; continue; }
      if (ch === "_") { items.push({ rest: true }); i++; continue; }
      if (ch === "^") { for (let k = items.length - 1; k >= 0; k--) if (items[k].semi !== undefined) { items[k].andolan = true; break; } i++; continue; }
      if (ch === ",") { breathAfter = true; i++; continue; }
      const n = noteAt(raw, i);
      if (!n) { i++; continue; }
      items.push({ semi: n.semi, kan, glide }); kan = null; glide = false; i = n.next;
    }
    if (items.length) tokens.push({ type: "beat", text: raw, items, breathAfter });
    else if (breathAfter) tokens.push({ type: "breath", text: raw });
    else tokens.push({ type: "bar", text: raw });
  });
  return { tokens, skipped };
}

// ev[i] = { semi, start, dur, kan, from, andolan, ti } with times in seconds.
// beats[i] = { t, ti, down } where down marks the first beat of a bar (from the | bar lines).
// barLen is the usual number of beats per bar. A short first bar is a pickup, so its first beat
// is not a downbeat (Happy Birthday starts on the upbeat).
function buildEvents(tokens, bpm) {
  const beat = 60 / (Number(bpm) || 72), ev = [], beats = [];
  let t = 0, cur = null, prev = null, afterBar = true;
  const bars = []; let n = 0;
  tokens.forEach(tk => { if (tk.type === "beat") n++; else if (tk.type === "bar" && n) { bars.push(n); n = 0; } });
  if (n) bars.push(n);
  const count = {}; bars.forEach(b => { count[b] = (count[b] || 0) + 1; });
  const barLen = bars.length > 1 ? Number(Object.keys(count).sort((a, b) => count[b] - count[a] || b - a)[0]) : 0;
  const pickup = bars.length > 1 && bars[0] < barLen;
  tokens.forEach((tk, ti) => {
    if (tk.type === "bar") { afterBar = true; return; }
    if (tk.type === "breath") { if (cur) { cur.dur = Math.max(0.06, cur.dur - 0.12); cur = null; } return; }
    if (tk.type !== "beat") return;
    const down = afterBar && !(pickup && beats.length === 0);
    afterBar = false;
    const sub = beat / tk.items.length;
    tk.items.forEach((it, k) => {
      const st = t + k * sub;
      if (it.hold) { if (cur) cur.dur += sub; }
      else if (it.rest) { cur = null; }
      else {
        cur = { semi: it.semi, start: st, dur: sub, kan: it.kan, from: it.glide && prev !== null ? prev : null, andolan: !!it.andolan, ti };
        ev.push(cur); prev = it.semi;
      }
    });
    if (tk.breathAfter && cur) { cur.dur = Math.max(0.06, cur.dur - 0.12); cur = null; }
    beats.push({ t, ti, down: barLen ? down : beats.length === 0 }); t += beat;
  });

}

// fit: "ok" (within .P..G'), "ceiling" (above G', up to M'), "reg3" (above M'), "below" (under .P).
function analyzeRange(ev) {
  if (!ev || !ev.length) return null;
  const kans = ev.filter(e => e.kan !== null && e.kan !== undefined).map(e => e.kan);
  const notes = [...new Set(ev.map(e => e.semi).concat(kans))].sort((a, b) => a - b);
  const lo = notes[0], hi = notes[notes.length - 1];
  const fit = lo < -5 ? "below" : hi > 18 ? "reg3" : hi > 16 ? "ceiling" : "ok";
  const halves = notes.filter(s => { const f = fingOf(s).f; return !!f && f.includes("H"); });
  const lesson = Math.max(...notes.map(lessonFor));
  const last = ev[ev.length - 1];
  return { lo, hi, fit, halves, lesson, notes, seconds: last.start + last.dur };
}

// Schedules the events; returns a stop() function, with stop.setClick(on) to switch the beat
// click on or off while playing and stop.t0 (the audio time the music starts). opts: { bpm, click,
// countIn (beats, played only with the click), mute (no melody: the learner plays it), onNote(e),
// onPreview(e) and lead (seconds before each note), onEnd() }.
function playEvents(ev, beats, opts) {
  opts = opts || {};

  // opts.at: an exact audio time to start (a loop continuing on the beat); otherwise just after now.
  const tStart = opts.at ? Math.max(opts.at, c.currentTime + 0.02) : c.currentTime + 0.25, t0 = tStart + countIn * beatS, voices = [], timers = [];

    // A prompt shortly before each note (opts.lead seconds), like karaoke: the next fingering appears in time to place it.
    if (opts.onPreview) timers.push(setTimeout(() => opts.onPreview(e), Math.max(0, (at - (opts.lead || 0.3) - c.currentTime) * 1000)));
    if (opts.mute) return;

      const k = Math.min(0.08, e.dur * 0.3);
      v = makeVoice(hzOf(e.kan), at, { andolan: e.andolan }); v.jump(hzOf(e.kan), f, at, k);
    } else if (e.from !== null && e.from !== undefined) {
      v = makeVoice(hzOf(e.from), at, { andolan: e.andolan }); v.ramp(hzOf(e.from), f, at, Math.max(0.08, e.dur * 0.7));
    } else {
      v = makeVoice(f, at, { andolan: e.andolan });
    }
    v.stop(at + e.dur - 0.01); voices.push(v);

  const clickBus = c.createGain(); clickBus.gain.value = opts.click ? 1 : 0; clickBus.connect(master());
  for (let i = 0; i < countIn; i++) click(tStart + i * beatS, i === 0 ? "sam" : "tick", clickBus);
  (beats || []).forEach(bt => click(t0 + bt.t, bt.down ? "sam" : "tick", clickBus));
  if (opts.onCount && countIn) for (let i = 0; i < countIn; i++) timers.push(setTimeout(() => opts.onCount(countIn - i), Math.max(0, (tStart + i * beatS - c.currentTime) * 1000)));
  const lastEnd = ev.length ? ev[ev.length - 1].start + ev[ev.length - 1].dur : 0;
  const total = beats ? Math.max(lastEnd, beats.length * beatS) : lastEnd;
  timers.push(setTimeout(() => { if (opts.onEnd) opts.onEnd(); }, (t0 - c.currentTime + total) * 1000 + 300));

  const stop = function () {
    if (stopped) return; stopped = true;
    const now = c.currentTime;
    voices.forEach(v => v.stop(now)); timers.forEach(clearTimeout);
    clickBus.disconnect();
  };
  stop.t0 = t0;
  stop.setClick = on => { if (!stopped) clickBus.gain.setTargetAtTime(on ? 1 : 0, c.currentTime, 0.01); };
  return stop;
}

// Pitch detection (YIN), recording analysis, live microphone tuner and the pitch plot.

const CHECK_PLANS = [
  ["Day 0: Sa only (XXX OOO, gentle air)", [0]],
  ["Register 1 tour: .P .D .N S R G M", [-5, -3, -1, 0, 2, 4, 6]],
  ["Middle octave, Kalyan: S R G M P D N S'", [0, 2, 4, 6, 7, 9, 11, 12]],
  ["Middle octave, Bilawal: S R G m P D N S'", [0, 2, 4, 5, 7, 9, 11, 12]],
  ["Octave pairs: .P P .D D .N N S S'", [-5, 7, -3, 9, -1, 11, 0, 12]],
  ["Half-holes: r g m d n (middle)", [1, 3, 5, 8, 10]],
  ["Upper octave: S' R' G' m' M'", [12, 14, 16, 17, 18]],
  ["Anything: just list what I played", []]
];

function yin(buf, sr) {
  const fmin = 170, fmax = 3000, tauMin = Math.floor(sr / fmax), tauMax = Math.min(Math.floor(sr / fmin), (buf.length >> 1) - 1);
  let rms = 0; for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i]; rms = Math.sqrt(rms / buf.length);
  if (rms < 0.006) return null;
  const W = buf.length - tauMax, d = new Float32Array(tauMax + 1);
  for (let tau = 1; tau <= tauMax; tau++) { let s = 0; for (let i = 0; i < W; i++) { const df = buf[i] - buf[i + tau]; s += df * df; } d[tau] = s; }
  const cm = new Float32Array(tauMax + 1); cm[0] = 1; let run = 0;
  for (let tau = 1; tau <= tauMax; tau++) { run += d[tau]; cm[tau] = run ? d[tau] * tau / run : 1; }
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++) { if (cm[t] < 0.15) { while (t + 1 <= tauMax && cm[t + 1] < cm[t]) t++; tau = t; break; } }
  if (tau < 1) return null;
  const x0 = cm[tau - 1], x2 = tau < tauMax ? cm[tau + 1] : cm[tau], den = x0 + x2 - 2 * cm[tau];
  const best = den ? tau + (x0 - x2) / (2 * den) : tau;
  return { f: sr / best, clarity: 1 - cm[tau], rms };
}

// How periodic (tone-like rather than breath-like) a frame is, 0 to 1: one minus the lowest
// normalised difference in the flute's pitch range. Unlike yin() it has no threshold, so a breathy
// note still gets a (low) value instead of none.
function periodicity(buf, sr) {
  const tauMin = Math.floor(sr / 3000), tauMax = Math.min(Math.floor(sr / 170), (buf.length >> 1) - 1);
  const W = buf.length - tauMax;
  let run = 0, best = 1;
  for (let tau = 1; tau <= tauMax; tau++) {
    let d = 0; for (let i = 0; i < W; i++) { const x = buf[i] - buf[i + tau]; d += x * x; }
    run += d;
    if (tau >= tauMin && run) best = Math.min(best, d * tau / run);
  }
  return Math.max(0, 1 - best);
}

function relSemi(f) { return 12 * Math.log2(f / saHz()); }

function verdict(cents) {
  const a = Math.abs(cents);
  return a <= 10 ? ["In tune", "good"] : a <= 25 ? ["Close", "warn"] : ["Adjust", "bad"];
}

// Repair the two common detector errors on real, breathy flute recordings:
// - octave errors: a frame one or two octaves away from its neighbours is folded back to them;
// - dropouts: a single unvoiced frame inside a steady note is filled, so the note is not split.
function cleanFrames(frames) {
  const out = frames.map(f => f && { s: f.s, f: f.f });
  for (let i = 0; i < out.length; i++) {
    if (!out[i]) continue;
    const near = [];
    for (let k = Math.max(0, i - 5); k <= Math.min(out.length - 1, i + 5); k++) if (k !== i && frames[k]) near.push(frames[k].s);
    if (near.length < 3) continue;
    near.sort((a, b) => a - b);
    const med = near[near.length >> 1];
    for (const oct of [12, -12, 24, -24]) {
      if (Math.abs(out[i].s + oct - med) < 0.6 && Math.abs(out[i].s - med) > 6) { out[i].s += oct; out[i].f *= Math.pow(2, oct / 12); break; }
    }
  }
  for (let i = 1; i < out.length - 1; i++) {
    if (!out[i] && out[i - 1] && out[i + 1] && Math.abs(out[i - 1].s - out[i + 1].s) < 0.35) out[i] = { s: (out[i - 1].s + out[i + 1].s) / 2, f: (out[i - 1].f + out[i + 1].f) / 2 };
  }
  return out;
}

// How far the whole recording sits from the equal-tempered notes of the set Sa, in cents.
// Cents wrap (+50 and -50 are the same place), so this is a circular average weighted by duration.
// Returns { cents, spread, seconds } or null. A consistent offset with a small spread means the
// flute itself is tuned away from Sa at A4 = 440 (common), not that every note was played out of tune.
function tuningOffset(segments) {
  let x = 0, y = 0, w = 0;
  for (const sg of segments) {
    const held = sg.t1 - sg.t0, a = (sg.med - Math.round(sg.med)) * 2 * Math.PI;
    x += Math.cos(a) * held; y += Math.sin(a) * held; w += held;
  }
  if (w < 1) return null;
  const cents = Math.atan2(y, x) / (2 * Math.PI) * 100;
  const devs = segments.map(sg => { let d = (sg.med - Math.round(sg.med)) * 100 - cents; d -= 100 * Math.round(d / 100); return Math.abs(d); }).sort((a, b) => a - b);
  return { cents: Math.round(cents), spread: Math.round(devs[devs.length >> 1]), seconds: w };
}

// A 6-hole bansuri cannot sound far below .P or above register 3, so "notes" there are detector
// errors (breath noise, a wrong octave). Drop them, unless most of the recording is out of range:
// then the flute's Sa setting is probably wrong, and the learner needs to see those notes.
function playableOnly(segments) {
  const ok = sg => sg.med > -7.5 && sg.med < 26.5, dur = sg => sg.t1 - sg.t0;
  const inside = segments.filter(ok);
  const tot = segments.reduce((s, sg) => s + dur(sg), 0), inDur = inside.reduce((s, sg) => s + dur(sg), 0);
  return tot && inDur / tot >= 0.6 ? inside : segments;
}

function segmentsFrom(frames, hopS) {
  const segs = []; let cur = null;
  frames.forEach((fr, i) => {
    if (fr && cur && Math.abs(fr.s - cur.mean) < 0.35) { cur.vals.push(fr.s); cur.end = i; cur.mean = cur.vals.reduce((a, b) => a + b, 0) / cur.vals.length; }
    else { if (cur) segs.push(cur); cur = fr ? { start: i, end: i, vals: [fr.s], mean: fr.s } : null; }
  });
  if (cur) segs.push(cur);
  return segs.filter(s => (s.end - s.start + 1) * hopS >= 0.3).map(s => {
    const v = s.vals.slice().sort((a, b) => a - b);
    return { t0: s.start * hopS, t1: (s.end + 1) * hopS, med: v[Math.floor(v.length / 2)] };
  });
}

async function decodeAudioFile(file) {
  const arr = await file.arrayBuffer();
  return ac().decodeAudioData(arr);
}

// Analyse a decoded AudioBuffer. Resolves { frames, hopS, segments, seconds, truncated }.
async function analyzeAudioBuffer(audio, opts) {
  opts = opts || {};
  const maxSeconds = opts.maxSeconds || 180;
  const raw = audio.getChannelData(0);
  let data = raw, sr = audio.sampleRate;
  if (sr > 32000) { const n = Math.floor(raw.length / 2); data = new Float32Array(n); for (let i = 0; i < n; i++) data[i] = (raw[2 * i] + raw[2 * i + 1]) * 0.5; sr = sr / 2; }
  const maxLen = Math.min(data.length, Math.floor(sr * maxSeconds));
  const size = 1024, hop = Math.round(sr * 0.03), frames = [], levels = [], clarities = [];
  let pos = 0;
  await new Promise(resolve => {
    const step = () => {
      const until = Math.min(maxLen - size, pos + hop * 120);
      for (; pos < until; pos += hop) {
        const buf = data.subarray(pos, pos + size);
        let sq = 0; for (let i = 0; i < buf.length; i++) sq += buf[i] * buf[i];
        levels.push(Math.sqrt(sq / buf.length));
        const r = yin(buf, sr);
        clarities.push(levels[levels.length - 1] > 0.004 ? periodicity(buf, sr) : 0);
        frames.push(r && r.clarity > 0.8 ? { s: relSemi(r.f), f: r.f } : null);
      }
      if (opts.onProgress) opts.onProgress(Math.min(100, Math.round(pos / Math.max(1, maxLen - size) * 100)));
      if (pos < maxLen - size) setTimeout(step, 0); else resolve();
    };
    step();
  });
  const hopS = hop / sr, clean = cleanFrames(frames), segments = playableOnly(segmentsFrom(clean, hopS));
  return { frames: clean, hopS, segments, seconds: maxLen / sr, truncated: data.length > maxLen, tone: toneEstimate(levels, clarities, clean, segments, hopS) };
}

// A tone estimate from 1 to 4, measured on the sounding part of a recording (the L08 tone rubric,
// approximated): how much of the sound has a clear pitch (breathy tone has less), how clean that pitch
// is, and how steady the held notes are. A guide to compare takes, not a teacher's judgement.
// Clarity needed for tone levels 2, 3 and 4, calibrated on synthetic flute tones with rising breath
// noise (tests/live.test.mjs); real recordings in a real room will need checking against a teacher.
const CLARITY = { 2: 0.55, 3: 0.86, 4: 0.94 };

function toneEstimate(levels, clarities, frames, segments, hopS) {
  const peak = Math.max(0, ...levels);

  if (sounding.length < 20) return null;

  const clarity = sounding.reduce((a, i) => a + clarities[i], 0) / sounding.length;
  // Steadiness: the spread (cents) inside each held note of at least 1 s, typical value.
  const spreads = [];
  for (const sg of segments || []) {

// rows[i] = { n, expected, near, cents, held, t0, t1, status, verdict: [label, kind] }

// sound does not shift every later row. Short stray sounds (slides between notes) are dropped.

  expected = expected || [];
  const row = (sg, exp, status) => {
    if (!sg) return { expected: exp, near: null, cents: null, held: 0, status: "missing", verdict: ["Missing", "bad"] };
    const near = Math.round(sg.med), cents = Math.round((sg.med - near) * 100), held = sg.t1 - sg.t0;
    const v = status === "extra" ? ["Extra", "info"] : status === "different" ? ["Different note", "bad"] : verdict(cents);
    return { expected: exp === undefined ? null : exp, near, cents, held, t0: sg.t0, t1: sg.t1, status, verdict: v };
  };

  if (!expected.length) rows = segments.map(sg => row(sg, undefined, "free"));

    const m = segments.length, n = expected.length, near = segments.map(sg => Math.round(sg.med));

    for (let i = 1; i <= m; i++) D[i][0] = D[i - 1][0] + skipSeg(i - 1);
    for (let j = 1; j <= n; j++) D[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {

function drawPitchPlot(canvas, result) {
  const frames = result.frames, hopS = result.hopS, segs = result.segments;
  const dpr = (typeof window !== "undefined" && window.devicePixelRatio) || 1, W = canvas.clientWidth || 600, H = canvas.clientHeight || 260;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const g = canvas.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const css = getComputedStyle(canvas);
  const col = (k, d) => (css.getPropertyValue(k) || "").trim() || d;
  const C = { ink: col("--ink", "#1b2420"), line: col("--line", "#cfd6ca"), muted: col("--muted", "#56645d"), accent: col("--accent", "#0d6a6e"), good: col("--good", "#2e7a3a"), warn: col("--warn", "#9a6512"), bad: col("--bad", "#b3261e"), mono: col("--mono", "monospace") };
  const vals = frames.filter(Boolean).map(f => f.s);
  let lo = -1, hi = 13; vals.forEach(v => { if (v < lo) lo = v; if (v > hi) hi = v; });
  lo = Math.floor(lo) - 1; hi = Math.ceil(hi) + 1;

  const padL = 44, padR = 10, padT = 10, padB = 22;
  const x = t => padL + (t / tot) * (W - padL - padR), y = s => padT + (hi - s) / (hi - lo) * (H - padT - padB);
  g.font = "12px " + C.mono; g.textBaseline = "middle";
  for (let s = lo; s <= hi; s++) {
    const pc = pcOf(s), natural = [0, 2, 4, 5, 7, 9, 11].includes(pc);
    g.strokeStyle = C.line; g.globalAlpha = natural ? 1 : 0.45; g.beginPath(); g.moveTo(padL, y(s)); g.lineTo(W - padR, y(s)); g.stroke(); g.globalAlpha = 1;
    if (natural || pc === 6) { g.fillStyle = pc === 0 ? C.accent : C.muted; g.fillText(codeOf(s), 6, y(s)); }
  }
  g.fillStyle = C.muted; g.fillText("0 s", padL, H - 8);
  g.textAlign = "right"; g.fillText(tot.toFixed(1) + " s", W - padR, H - 8); g.textAlign = "left";
  g.fillStyle = C.ink;
  frames.forEach((f, i) => { if (f && f.s >= lo && f.s <= hi) g.fillRect(x(i * hopS), y(f.s) - 1, 2, 2); });

}

  if (typeof navigator === "undefined" || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("unavailable");

// ---- core/listen.js ----
// Live listening: one shared microphone turned into pitch readings, and the pure logic the
// interactive exercises build on (steady holds, note sequences, tap timing). The logic takes
// readings as plain objects { t, semi, near, cents }, so it is unit-tested without a microphone.

// Readings are suppressed until the given audio time.

  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  const c = ac(), src = c.createMediaStreamSource(stream), an = c.createAnalyser();

  m.stats = { frames: 0, voiced: 0, ms: 0, sampleRate: c.sampleRate, peak: 0 };

    if (!best || Math.abs(t - best.t) > beatS / 2 || best.used) return;
    best.used = true;
    const off = (t - best.t) * 1000 - (calibrating ? 0 : tapLatency());
    offsets.push({ off, silent: best.silent });
    const x = 50 + Math.max(-50, Math.min(50, off / RANGE * 50));
    lane.append(lvEl("b", { class: "lv-dot" + (best.silent ? " lv-silent" : "") + (Math.abs(off) <= 50 ? " lv-good" : ""), style: `left:${x}%`, title: `${Math.round(off)} ms ${off < 0 ? "early" : "late"}` }));
  }
  function describe(st) {
    if (!st) return "";
    const side = Math.abs(st.mean) <= 15 ? "right on the beat" : `${Math.abs(st.mean)} ms ${st.mean < 0 ? "early (rushing)" : "late (dragging)"}`;
    return `on average ${side}, spread ${st.spread} ms, ${Math.round(st.within * 100)}% within 50 ms`;
  }
  function clearRun() {
    clearTimeout(endTimer); flashTimers.forEach(clearTimeout); flashTimers = [];
    if (bus) { bus.disconnect(); bus = null; }
    lights.querySelectorAll("i").forEach(i => i.className = "");
    running = false; pad.disabled = true; startBtn.textContent = "Start"; padTxt.textContent = "Tap";
  }
  function finish(complete) {
    const tapped = offsets.length;
    clearRun();
    if (calibrating) {
      calibrating = false;
      const v = offsets.map(x => x.off).sort((a, b) => a - b);
      if (v.length < 5) { msg.textContent = "Calibration needs at least 5 taps, exactly with the clicks. Press Calibrate to try again."; thenPlay = false; return; }
      const med = v[v.length >> 1], spread = v[v.length - 2] - v[1];
      if (spread > 160) { msg.textContent = "The taps were too uneven to calibrate. Press Calibrate and tap exactly with the click."; thenPlay = false; return; }
      tapLatency(Math.max(-40, Math.min(350, med)));
      showCal();
      if (thenPlay) { thenPlay = false; msg.textContent = "Calibrated. Now the real round: count-in, then tap."; nextTimer = setTimeout(() => start(false), 1200); }
      else msg.textContent = "Calibrated. Your results now leave out this device's delay.";
      return;
    }
    if (complete !== true) { msg.textContent = tapped ? `Stopped after ${tapped} tap${tapped === 1 ? "" : "s"}. Press Start for a full round of 16 beats.` : "Stopped."; return; }
    const all = tapStats(offsets.map(x => x.off)), heard = tapStats(offsets.filter(x => !x.silent).map(x => x.off)), quiet = tapStats(offsets.filter(x => x.silent).map(x => x.off));
    if (!all) { msg.textContent = "No taps landed near the beats. Tap on the pad, the space bar or any key, with each click."; return; }
    let text = `${all.n} of ${beats.length} beats tapped: ` + (quiet ? `with the click ${describe(heard)}; in the silent bars ${describe(quiet)}.` : describe(all) + ".");
    // Every tap late (or early) by about the same amount is the device, not the player.
    if (!tapCalibrated() && Math.abs(all.mean) > 90 && all.spread < 90) text += ` All your taps are off by about the same ${Math.abs(all.mean)} ms: that is usually the audio device's delay (Bluetooth adds 150-250 ms). Press Calibrate once and this disappears.`;
    else if (all.n < beats.length * 0.6) text += " Many beats had no tap: keep tapping through the whole round, even when unsure.";
    else if (quiet && heard && Math.abs(quiet.mean - heard.mean) > 40) text += " Your pulse drifted without the click: count the beats aloud, then in your head.";
    else if (all.spread > 60) text += " Aim for a steadier tap before going faster.";
    else if (all.within >= 0.8) text += " Excellent. Try a faster tempo or the silent bars.";
    msg.textContent = text;
    emitLive({ type: "tap", bpm: Number(bpmSel.value), silent: !!quiet, mean: all.mean, spread: all.spread, within: Math.round(all.within * 100) / 100 });
  }
  function start(cal) {
    if (running) { finish(false); return; }
    // The first round on a device calibrates first, so its delay is not reported as dragging.
    if (cal !== true && !tapCalibrated()) { thenPlay = true; cal = true; }
    calibrating = cal === true;
    const c = ac(), beatS = 60 / (calibrating ? 90 : Number(bpmSel.value)), t0 = c.currentTime + 0.3;
    beats = []; offsets = []; lane.querySelectorAll(".lv-dot").forEach(d => d.remove());
    const silent = !calibrating && modeSel.value === "silent";
    // The clicks go through their own bus, so Stop silences the ones already scheduled.
    bus = c.createGain(); bus.connect(master());
    const heardDelay = (tapLatency() || (c.outputLatency || 0) * 1000) / 1000;
    const flash = (t, i, label, quiet) => flashTimers.push(setTimeout(() => {
      lights.querySelectorAll("i").forEach((x, k) => { x.className = k === i ? (quiet ? "lv-on lv-quiet" : "lv-on") : ""; });
      padTxt.textContent = label;
    }, Math.max(0, (t + heardDelay - c.currentTime) * 1000)));
    for (let i = 0; i < 4; i++) { click(t0 + i * beatS, i === 0 ? "sam" : "tick", bus); flash(t0 + i * beatS, i, String(4 - i), false); }
    const n = calibrating ? 8 : 16;
    for (let i = 0; i < n; i++) {
      const t = t0 + (4 + i) * beatS, quiet = silent && i >= 8;
      if (!quiet) click(t, i % 4 === 0 ? "sam" : "tick", bus);
      flash(t, i % 4, quiet ? "keep going" : "Tap", quiet);
      beats.push({ t, silent: quiet, used: false });
    }
    running = true; pad.disabled = false; startBtn.textContent = "Stop";
    msg.textContent = calibrating ? (thenPlay ? "First, a quick calibration for this device: after the count-in, tap exactly with the 8 clicks." : "Calibrating: after the count-in, tap exactly with the 8 clicks.") : silent ? "Count-in, then tap. The click stops after two bars: keep tapping." : "Count-in, then tap on every beat.";
    endTimer = setTimeout(() => finish(true), ((t0 + (4 + n) * beatS) - c.currentTime + 0.6) * 1000);
  }
  startBtn.addEventListener("click", () => start(false));
  calBtn.addEventListener("click", () => { clearTimeout(nextTimer); if (running) finish(false); thenPlay = false; start(true); });
  showCal();
  pad.addEventListener("pointerdown", e => { e.preventDefault(); tap(); });
  const onKey = e => { if (!running || e.repeat || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || "")) return; e.preventDefault(); tap(); };
  document.addEventListener("keydown", onKey);
  const abort = () => { clearTimeout(nextTimer); if (!running) return; calibrating = false; thenPlay = false; clearRun(); msg.textContent = "Stopped."; };
  return { el, stop: abort, destroy() { clearTimeout(nextTimer); calibrating = false; thenPlay = false; clearRun(); document.removeEventListener("keydown", onKey); } };
}

// ---------- Find my flute ----------
// The learner plays Sa (top three holes closed, gentle air) for 3 s; the app names the note and
// sets the flute's Sa, octave and tuning from it.
function fluteFinder(opts) {
  const o = Object.assign({ onApply: null }, opts || {});
  let unsub = null, tracker = null, freqs = [], found = null;
  const life = { gen: 0, dead: false, starting: false };
  const msg = lvEl("p", { class: "lv-msg", "aria-live": "polite" }, "Close the top three holes, blow gently, and hold your Sa steadily for 3 seconds.");
  const big = lvEl("div", { class: "lv-big" }, "?");
  const detail = lvEl("p", { class: "lv-count" });
  const startBtn = lvEl("button", { type: "button", class: "lv-btn lv-primary" }, "Listen for my Sa");
  const useBtn = lvEl("button", { type: "button", class: "lv-btn lv-primary", hidden: true }, "Use this for my flute");
  const el = lvEl("div", { class: "lv lv-finder" }, msg, lvEl("div", { class: "lv-row" }, big, detail), lvEl("div", { class: "lv-row" }, startBtn, useBtn));
  function stop() { life.gen++; if (unsub) { unsub(); unsub = null; } startBtn.textContent = found ? "Listen again" : "Listen for my Sa"; }
  function onReading(r) {
    const s = tracker.feed(r);
    if (r.semi === null) return;
    if (s.held < 0.05) freqs = [];
    freqs.push(r.f);
    const midi = 69 + 12 * Math.log2(r.f / 440), near = Math.round(midi);
    big.textContent = WEST[(near % 12 + 12) % 12] + (Math.floor(near / 12) - 1);
    detail.textContent = `${r.f.toFixed(1)} Hz, held ${s.held.toFixed(1)} s`;
    if (s.done) {
      const v = freqs.slice().sort((a, b) => a - b), f = v[v.length >> 1];
      const m = 69 + 12 * Math.log2(f / 440), n = Math.round(m), cents = Math.round((m - n) * 100);
      const note = (n % 12 + 12) % 12, oct = Math.floor(n / 12) - 1;
      const a4 = Math.abs(cents) >= 8 ? Math.round(440 * Math.pow(2, cents / 1200) * 10) / 10 : 440;
      found = { saNote: note, saOct: Math.min(5, Math.max(4, oct)), a4, f, cents, oct };
      big.textContent = WEST[note] + oct;
      const off = Math.abs(cents) < 8 ? "in tune with A4 = 440 Hz" : `${Math.abs(cents)} cents ${cents > 0 ? "sharp" : "flat"} of standard pitch (tuning set to A4 = ${a4} Hz)`;
      msg.textContent = `Your Sa is ${WEST[note]}${oct} (${f.toFixed(1)} Hz), ${off}.` + (oct < 4 || oct > 5 ? " This flute is outside the bass and medium range the app supports; the nearest octave is used." : "");
      useBtn.hidden = false; lvChime(); stop();
    }
  }
  startBtn.addEventListener("click", async () => {
    if (life.starting) return;
    if (unsub) { stop(); return; }
    life.starting = true;
    const g0 = life.gen;
    try {
      if (!(await micIntro(el)) || life.dead || life.gen !== g0) return;
      tracker = holdTracker({ target: null, seconds: 3, cents: 20 }); freqs = []; found = null; useBtn.hidden = true;
      ac();
      const u = await lvListen(life, onReading);
      if (!u) return;
      unsub = u; startBtn.textContent = "Stop"; msg.textContent = "Listening... hold your Sa.";
    } catch (e) { msg.textContent = lvMicError(e); }
    finally { life.starting = false; }
  });
  useBtn.addEventListener("click", () => {
    if (!found) return;
    setSettings({ saNote: found.saNote, saOct: found.saOct, a4: found.a4 });
    msg.textContent = `Saved: Sa = ${WEST[found.saNote]}${found.saOct}, A4 = ${found.a4} Hz. Every pitch in the app now follows your flute.`;
    useBtn.hidden = true;
    emitLive({ type: "flute", saNote: found.saNote, saOct: found.saOct, a4: found.a4 });
    if (o.onApply) { try { o.onApply(found); } catch (e) { /* ignore */ } }
  });
  return { el, stop, destroy() { life.dead = true; stop(); } };
}

// ---------- Name the note (ear test) ----------
// Sa, then a note: the learner names it. opts: { notes: [semi], count, pass, drone, onPass(score) }.
// Used for milestone items such as "identify 20 single notes from S R G P, 18/20".
function noteQuiz(opts) {
  const o = Object.assign({ notes: [0, 2, 4, 7], count: 20, pass: 18, onPass: null }, opts || {});
  let n = 0, right = 0, target = null, answered = true, voices = [];
  const msg = lvEl("p", { class: "lv-msg", "aria-live": "polite" }, `You hear Sa, then a note. Name the note. ${o.count} questions; ${o.pass} right to pass.`);
  const score = lvEl("span", { class: "lv-count" }, `0 of ${o.count}`);
  const opts2 = lvEl("div", { class: "lv-row lv-answers" });
  const goBtn = lvEl("button", { type: "button", class: "lv-btn lv-primary" }, "Start");
  const againBtn = lvEl("button", { type: "button", class: "lv-btn", disabled: true }, "Hear again");
  const drone = lvDrone("Drone");
  const el = lvEl("div", { class: "lv lv-quiz" }, lvEl("div", { class: "lv-row" }, score, drone.el), opts2, msg, lvEl("div", { class: "lv-row" }, goBtn, againBtn));
  const hush = () => { voices.forEach(v => v.stop()); voices = []; };
  function play() {
    hush();
    const c = ac(), t = c.currentTime + 0.05;
    const a = makeVoice(hzOf(0), t); a.stop(t + 0.8);
    const b = makeVoice(hzOf(target), t + 1.0); b.stop(t + 2.1);
    voices = [a, b];
  }
  function ask() {
    if (n >= o.count) return finish();
    target = o.notes[Math.floor(Math.random() * o.notes.length)]; answered = false;
    msg.textContent = `Question ${n + 1} of ${o.count}: which note came second?`;
    opts2.replaceChildren(...o.notes.map(s => {
      const b = lvEl("button", { type: "button", class: "lv-btn lv-ans" }, codeOf(s));
      b.addEventListener("click", () => {
        if (answered) return;
        answered = true; n++;
        const ok = s === target; if (ok) right++;
        b.classList.add(ok ? "lv-right" : "lv-wrong");
        if (!ok) { const r = [...opts2.children].find(x => x.textContent === codeOf(target)); if (r) r.classList.add("lv-right"); }
        score.textContent = `${right} of ${n} right`;
        setTimeout(ask, ok ? 700 : 1500);
      });
      return b;
    }));
    play();
  }
  function finish() {
    hush(); opts2.replaceChildren(); againBtn.disabled = true; goBtn.disabled = false; goBtn.textContent = "Again";
    const passed = right >= o.pass;
    msg.textContent = `${right} of ${o.count} right. ` + (passed ? "Passed." : `${o.pass} needed: practise with the Ear quiz and try again.`);
    emitLive({ type: "earTest", right, total: o.count });
    if (passed) { el.classList.add("lv-passed"); lvChime(); if (o.onPass) { try { o.onPass({ right, total: o.count }); } catch (e) { /* ignore */ } } }
  }
  goBtn.addEventListener("click", () => { ac(); n = 0; right = 0; el.classList.remove("lv-passed"); goBtn.disabled = true; againBtn.disabled = false; score.textContent = `0 of ${o.count}`; ask(); });
  againBtn.addEventListener("click", () => { if (target !== null && !answered) play(); });
  return { el, stop: hush, destroy() { hush(); drone.stop(); } };
}

// ---------- Name that raga ----------
// A phrase from one raga plays over the drone; the learner names the raga.
// ragas: [{ name, phrases: [[semi]] }] (aroh, avroh, pakad...). Needs no microphone.
function ragaQuiz(opts) {
  const o = Object.assign({ ragas: [], choices: 4 }, opts || {});
  let current = null, answered = true, right = 0, total = 0, voices = [];
  const msg = lvEl("p", { class: "lv-msg", "aria-live": "polite" }, "Listen to a phrase and name its raga. Notice which notes are missing and which ones the phrase leans on.");
  const score = lvEl("span", { class: "lv-count" });
  const answers = lvEl("div", { class: "lv-row lv-answers" });
  const goBtn = lvEl("button", { type: "button", class: "lv-btn lv-primary" }, "Play a phrase");
  const againBtn = lvEl("button", { type: "button", class: "lv-btn", disabled: true }, "Hear again");
  const drone = lvDrone("Drone");
  const el = lvEl("div", { class: "lv lv-ragaquiz" }, lvEl("div", { class: "lv-row" }, score, drone.el), answers, msg, lvEl("div", { class: "lv-row" }, goBtn, againBtn));
  const hush = () => { voices.forEach(v => v.stop()); voices = []; };
  function play() {
    hush();
    const c = ac(), t0 = c.currentTime + 0.1, noteS = 0.55;
    current.phrase.forEach((s, i) => { const v = makeVoice(hzOf(s), t0 + i * noteS); v.stop(t0 + i * noteS + noteS * 0.9); voices.push(v); });
  }
  function ask() {
    const pool = o.ragas.filter(r => r.phrases.length);
    if (pool.length < 2) { msg.textContent = "Not enough ragas with notated phrases."; return; }
    const r = pool[Math.floor(Math.random() * pool.length)];
    const others = pool.filter(x => x !== r).sort(() => Math.random() - 0.5).slice(0, o.choices - 1);
    current = { raga: r, phrase: r.phrases[Math.floor(Math.random() * r.phrases.length)] };
    answered = false; againBtn.disabled = false;
    answers.replaceChildren(...[r].concat(others).sort(() => Math.random() - 0.5).map(x => {
      const b = lvEl("button", { type: "button", class: "lv-btn lv-ans" }, x.name);
      b.addEventListener("click", () => {
        if (answered) return;
        answered = true; total++;
        const ok = x === r; if (ok) right++;
        b.classList.add(ok ? "lv-right" : "lv-wrong");
        if (!ok) { const c = [...answers.children].find(y => y.textContent === r.name); if (c) c.classList.add("lv-right"); }
        msg.textContent = ok ? `Yes: ${r.name}.` : `It was ${r.name}.` + (r.hint ? " " + r.hint : "");
        score.textContent = `${right} of ${total} right`;
        emitLive({ type: "ragaQuiz", correct: ok });
      });
      return b;
    }));
    msg.textContent = "Which raga is this?";
    play();
  }
  goBtn.addEventListener("click", () => { ac(); ask(); });
  againBtn.addEventListener("click", () => { if (current) play(); });
  return { el, stop: hush, destroy() { hush(); drone.stop(); } };
}

  if (has("tones")) panels.push(`

  if (has("rhythm")) panels.push(`

  if (has("check")) panels.push(`

        <h2>Check a recording of your flute</h2>

        <label class="bb-field">What did you play? <select data-ref="plan"></select></label>

        <div class="bb-row"><button type="button" class="bb-btn bb-primary" data-ref="micBtn">Start microphone</button></div>
        <div class="bb-meter">

  if (has("ear")) panels.push(`

        <label class="bb-field">Level <select data-ref="earLevel"><option value="2">Level 2: Sa or Pa</option><option value="3">Level 3: S R G P</option><option value="4">Level 4: all shuddha swaras</option><option value="6">Level 6: all 12 notes</option></select></label>

      <p class="bb-small"><span data-ref="earScore">Score: 0 / 0</span> &middot; <button type="button" class="bb-btn bb-tiny" data-ref="earReset">Reset score</button></p>

  </section>`);
  if (has("about")) panels.push(`
  <section class="bb-panel" data-panel="about" hidden>
    <div class="bb-grid2">
      <div class="bb-card">
        <h2>This bench can confirm</h2>
        <ul class="bb-tidy">
          <li>Which note every fingering in the master chart gives, in both breaths, and its exact pitch for your flute's Sa.</li>
          <li>How every curriculum melody, alankar, scale and raga phrase should sound, at any tempo.</li>
          <li>Whether a song notation fits your flute's range, which half-holes it needs, and which lesson unlocks it.</li>
          <li>Your Sa on Day 0, and whether each note of your real flute is in tune, from a recording.</li>
          <li>The beat structure of keherwa, dadra, teentaal, rupak, jhaptaal and ektaal, and the tihai examples.</li>
          <li>Your progress through EX-EAR Levels 2, 3, 4 and 6.</li>
        </ul>
      </div>
      <div class="bb-card">
        <h2>It cannot confirm</h2>
        <ul class="bb-tidy">
          <li><b>Your tone.</b> The flute sound here is synthesised. It shows pitch and melody, not what a beautiful bansuri tone sounds like. Use the listening library for that.</li>
          <li><b>Your embouchure, posture and hands.</b> Use a mirror, video and a teacher (L02, L04, L08).</li>
          <li><b>Raga intonation and ornament style.</b> Meend, kan and andolan here are mechanical sketches; masters bend notes in ways no tuner measures.</li>
          <li><b>3rd-register fingerings</b> (flute-specific, L22).</li>
          <li><b>Rhythm feel.</b> A metronome keeps time; it cannot tell you whether a phrase breathes musically.</li>
        </ul>

  return `${header}${flute}
  <nav class="bb-tabs" role="tablist" aria-label="Workbench">${tabsHtml}</nav>
  ${panels.join("")}`;
}

function mountBench(container, opts) {
  opts = opts || {};
  const uid = "bb" + (++benchMounts);
  const compact = !!opts.compact;
  const tabs = BENCH_TABS.filter(([k]) => !opts.tabs || opts.tabs.indexOf(k) >= 0);
  const o = { tabs, compact, heading: opts.heading !== undefined ? !!opts.heading : !compact, settings: !compact, flute: opts.flute !== false };
  const root = document.createElement("div");
  root.className = "bb-bench" + (compact ? " bb-compact" : "");
  root.innerHTML = benchTemplate(uid, o);
  container.appendChild(root);
  const q = r => root.querySelector(`[data-ref="${r}"]`);
  const has = k => tabs.some(t => t[0] === k);
  const cleanups = [];
  let destroyed = false, startedTan = false;
  const listen = (el, ev, fn, o2) => { if (!el) return; el.addEventListener(ev, fn, o2); cleanups.push(() => el.removeEventListener(ev, fn, o2)); };

  // ---------- Flute ----------
  let holes = ["X", "X", "X", "O", "O", "O"], reg = 1, liveVoice = null;
  function buildSvg() {
    if (!o.flute) return;
    const s = [];
    s.push(`<defs><linearGradient id="${uid}-bam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--bamboo)"/><stop offset="0.55" style="stop-color:var(--bamboo)"/><stop offset="1" style="stop-color:var(--bamboo-deep)"/></linearGradient>`);
    BENCH_HOLE_X.forEach((x, i) => s.push(`<clipPath id="${uid}-half${i}"><rect x="${x - 20}" y="40" width="20" height="40"/></clipPath>`));
    s.push("</defs>");
    s.push('<text x="430" y="24">top hand</text><text x="690" y="24">bottom hand</text>');
    s.push(`<rect x="20" y="42" width="960" height="40" rx="20" fill="url(#${uid}-bam)"/>`);
    [70, 300, 640, 930].forEach(x => s.push(`<rect x="${x}" y="42" width="5" height="40" fill="var(--node)" opacity="0.7"/>`));
    [[36, 6], [950, 6]].forEach(([x, n]) => { for (let k = 0; k < n; k++) s.push(`<rect x="${x + k * 3}" y="42" width="1.6" height="40" fill="var(--hole)" opacity="0.55"/>`); });
    s.push('<ellipse cx="150" cy="62" rx="13" ry="10" fill="var(--hole)"/>');
    s.push('<g class="bb-air" data-ref="air"><path d="M150 40 q 10 -8 20 0 t 20 0 t 20 0" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/></g>');
    s.push('<text x="112" y="112">blowing hole</text>');
    BENCH_HOLE_X.forEach((x, i) => {
      s.push(`<g class="bb-holehit" data-i="${i}"><circle cx="${x}" cy="62" r="24" fill="transparent"/><circle cx="${x}" cy="62" r="13" fill="var(--hole)"/>`);
      s.push(`<circle data-ref="pad${i}" cx="${x}" cy="62" r="17" fill="var(--finger)" stroke="var(--finger-edge)" stroke-width="2"/></g>`);
      s.push(`<text x="${x - 5}" y="112">${i + 1}</text>`);
    });
    q("fluteSvg").innerHTML = s.join("");
    q("fluteSvg").querySelectorAll(".bb-holehit").forEach(g => listen(g, "click", () => cycleHole(Number(g.dataset.i))));
    const strip = q("holesStrip"); strip.innerHTML = "";
    BENCH_HOLE_X.forEach((x, i) => {
      if (i === 3) strip.appendChild(document.createElement("span"));
      const b = document.createElement("button"); b.type = "button"; b.className = "bb-holebtn"; b.dataset.ref = "hb" + i;
      b.innerHTML = '<span class="bb-dot"></span><span class="bb-st"></span><span class="bb-lab">hole ' + (i + 1) + "</span>";
      listen(b, "click", () => cycleHole(i)); strip.appendChild(b);
    });
  }
  function cycleHole(i) { holes[i] = holes[i] === "O" ? "X" : holes[i] === "X" ? "H" : "O"; render(); }
  function setFingering(f, r) { holes = f.split(""); reg = r; render(); }
  function current() {
    const pat = holes.join(""), base = BASE[pat];
    return base === undefined ? { pat, semi: null } : { pat, semi: base + 12 * (reg - 1) };
  }
  function render() {
    const cur = current();
    if (o.flute) {
      holes.forEach((s, i) => {
        const pad = q("pad" + i);
        pad.style.display = s === "O" ? "none" : "";
        if (s === "H") pad.setAttribute("clip-path", `url(#${uid}-half${i})`); else pad.removeAttribute("clip-path");
        const b = q("hb" + i); b.dataset.s = s;
        b.querySelector(".bb-st").textContent = s === "X" ? "closed" : s === "H" ? "half" : "open";
        b.setAttribute("aria-label", `Hole ${i + 1}: ${s === "X" ? "closed" : s === "H" ? "half closed" : "open"}`);
      });
      q("reg1").setAttribute("aria-pressed", String(reg === 1)); q("reg2").setAttribute("aria-pressed", String(reg === 2));
      const f = cur.pat.slice(0, 3) + " " + cur.pat.slice(3);
      if (cur.semi === null) {
        q("rName").textContent = "?"; q("rDeva").textContent = ""; q("rCode").textContent = f;
        q("rFacts").innerHTML = `<span>Fingering <b>${f}</b></span>`;
        q("rStatus").innerHTML = '<span class="bb-chip bb-warn">Not in the standard chart</span> <span class="bb-small bb-muted">Cross-fingerings vary between flutes (L25). Test this one on your own flute with the Check my flute tab.</span>';
        if (liveVoice) { liveVoice.stop(ac().currentTime); liveVoice = null; }
      } else {
        const s = cur.semi, L = letterOf(s);
        q("rName").textContent = capFirst(NAME[L]); q("rDeva").textContent = DEVA[L]; q("rCode").textContent = codeOf(s);
        q("rFacts").innerHTML = `<span>Saptak <b>${octName(s)}</b></span><span>Western <b>${westOf(s)}</b></span><span>Pitch <b>${hzOf(s).toFixed(1)} Hz</b></span><span>Fingering <b>${f}</b></span><span>Lesson <b>L${pad2(lessonFor(s))}</b></span>`;
        const hard = cur.pat.includes("H");
        q("rStatus").innerHTML = `<span class="bb-chip bb-good">Standard fingering</span> <span class="bb-small bb-muted">${DIFF[String(s)] || ""}${hard ? " &middot; half-hole: check it with a tuner on your flute" : ""}</span>`;
        if (liveVoice) liveVoice.glideNow(hzOf(s));
      }
    }
    root.querySelectorAll("[data-ref=chartBody] tr").forEach(tr => tr.classList.toggle("bb-current", cur.semi !== null && Number(tr.dataset.semi) === cur.semi));
  }
  function startBlow() {
    const cur = current(); if (cur.semi === null || liveVoice || destroyed) return;
    liveVoice = makeVoice(hzOf(cur.semi), ac().currentTime + 0.01);
    q("blowBtn").classList.add("bb-active"); q("air").classList.add("bb-on");
  }
  function stopBlow() {
    if (liveVoice) { liveVoice.stop(ac().currentTime); liveVoice = null; }
    if (o.flute) { q("blowBtn").classList.remove("bb-active"); q("air").classList.remove("bb-on"); }
  }
  if (o.flute) {
    const bb = q("blowBtn");
    listen(bb, "pointerdown", e => { e.preventDefault(); try { bb.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } startBlow(); });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => listen(bb, ev, stopBlow));
    listen(bb, "keydown", e => { if (e.key === "Enter" && !e.repeat) startBlow(); });
    listen(bb, "keyup", e => { if (e.key === "Enter") stopBlow(); });
    listen(q("reg1"), "click", () => { reg = 1; render(); });
    listen(q("reg2"), "click", () => { reg = 2; render(); });
    const keyOk = e => {
      if (destroyed || !root.isConnected) return false;
      const t = e.target, tag = (t && t.tagName || "").toLowerCase();
      if (["input", "textarea", "select"].includes(tag) || (t && t.isContentEditable)) return false;
      return root.contains(t) || t === document.body || t === document.documentElement;
    };
    listen(document, "keydown", e => {
      if (!keyOk(e)) return;
      const tag = (e.target.tagName || "").toLowerCase();
      if (e.key >= "1" && e.key <= "6") cycleHole(Number(e.key) - 1);
      else if (e.key === "q" || e.key === "Q") { reg = 1; render(); }
      else if (e.key === "w" || e.key === "W") { reg = 2; render(); }
      else if (e.code === "Space" && !e.repeat && tag !== "button") { e.preventDefault(); startBlow(); }
    });
    listen(document, "keyup", e => { if (e.code === "Space") stopBlow(); });
  }

  // ---------- Settings ----------
  if (o.settings) {
    const sel = q("saNote");
    WEST.forEach((w, i) => { const op = document.createElement("option"); op.value = i; op.textContent = w; sel.appendChild(op); });
    const fill = () => {
      const s = getSettings(); sel.value = String(s.saNote); q("saOct").value = String(s.saOct); q("a4").value = String(s.a4); q("vol").value = String(Math.round(s.volume * 100));
      q("fluteSum").textContent = `Sa ${westOf(0)} · ${hzOf(0).toFixed(1)} Hz · A4 ${s.a4}`;
    };
    fill();
    listen(sel, "change", () => setSettings({ saNote: Number(sel.value) }));
    listen(q("saOct"), "change", () => setSettings({ saOct: Number(q("saOct").value) }));
    listen(q("a4"), "change", () => setSettings({ a4: Number(q("a4").value) }));
    listen(q("vol"), "input", () => setSettings({ volume: Number(q("vol").value) / 100 }));
    cleanups.push(onSettings(fill));
  }

  // ---------- Chart ----------
  function miniHtml(f) {
    if (!f) return "";
    return '<span class="bb-mini" aria-label="' + f + '">' + f.split("").map((c, i) => (i === 3 ? '<span class="bb-gap"></span>' : "") + `<i class="${c === "X" ? "x" : c === "H" ? "h" : ""}"></i>`).join("") + "</span>";
  }
  function buildChart() {
    const tb = q("chartBody"); if (!tb) { render(); return; }
    tb.innerHTML = "";
    for (let s = -5; s <= 18; s++) {
      const fo = fingOf(s), L = letterOf(s);
      const tr = document.createElement("tr"); tr.className = "bb-clickable"; tr.dataset.semi = s; tr.tabIndex = 0;
      tr.innerHTML = `<td class="bb-mono"><b>${codeOf(s)}</b></td><td>${octName(s)} ${NAME[L]} <span class="bb-muted">${DEVA[L]}</span></td><td>${miniHtml(fo.f)} <span class="bb-mono bb-small">${fo.f.slice(0, 3)} ${fo.f.slice(3)}</span></td><td>${fo.reg === 1 ? "gentle (1)" : "faster (2)"}</td><td class="bb-mono">${westOf(s)}</td><td>${hzOf(s).toFixed(1)}</td><td class="bb-small">${DIFF[String(s)]}</td><td class="bb-mono">L${pad2(lessonFor(s))}</td>`;

    try { audio = await decodeAudioFile(file); }
    catch (e) { st.textContent = "This browser could not open that file. Try an MP3, M4A or WAV recording."; return; }
    const res = await analyzeAudioBuffer(audio, { onProgress: p => { if (!destroyed) st.textContent = `Analysing... ${p}%`; } });
    if (destroyed) return;
    st.textContent = `Done: ${res.seconds.toFixed(1)} s analysed, ${res.segments.length} steady note${res.segments.length === 1 ? "" : "s"} found.` + (res.truncated ? " Only the first 3 minutes were analysed." : "");
    showResults(res, CHECK_PLANS[Number(q("plan").value)][1]);
  }
  function tunerBlank() {
    q("tName").textContent = "-"; q("tDetail").textContent = "";
    const n = q("tNeedle"); n.style.left = "50%"; n.style.background = "var(--muted)";
  }
  function micOff() {
    if (micStop) { micStop(); micStop = null; }
    if (micIdle) { clearInterval(micIdle); micIdle = null; }
    if (has("check")) { q("micBtn").textContent = "Start microphone"; tunerBlank(); }
  }
  async function micToggle() {
    if (micStop) { micOff(); return; }
    const st = q("micStatus");
    try {
      micStop = await startMicTuner(r => {
        micLast = performance.now();
        const L = letterOf(r.near);
        q("tName").textContent = codeOf(r.near);
        q("tDetail").textContent = `${NAME[L]} · ${westOf(r.near)} · ${r.f.toFixed(1)} Hz · ${r.cents > 0 ? "+" : ""}${r.cents} cents`;
        const n = q("tNeedle");
        n.style.left = (50 + Math.max(-50, Math.min(50, r.cents))) + "%";
        n.style.background = Math.abs(r.cents) <= 10 ? "var(--good)" : Math.abs(r.cents) <= 25 ? "var(--warn)" : "var(--bad)";
      });
      if (destroyed) { micOff(); return; }
      q("micBtn").textContent = "Stop microphone"; st.textContent = "Listening. Play a long note.";
      // Clear the reading when the note stops, so an old note is not left on screen.
      micIdle = setInterval(() => { if (micLast && performance.now() - micLast > 500) { micLast = 0; tunerBlank(); } }, 200);
    } catch (e) {
      micStop = null;
      st.textContent = e && e.message === "unavailable"
        ? "Live microphone is not available in this view. Use the recording check, or open tools/practice-bench.html in Chrome or Edge."
        : "Live microphone is blocked in this view. Use the recording check, or open tools/practice-bench.html in Chrome or Edge.";
    }
  }
  if (has("check")) {
    const sel = q("plan");
    CHECK_PLANS.forEach((p, i) => { const op = document.createElement("option"); op.value = i; op.textContent = p[0]; sel.appendChild(op); });
    if (opts.checkPlan !== undefined && CHECK_PLANS[opts.checkPlan]) sel.value = String(opts.checkPlan);
    // Reset the input after reading, so choosing the same file again analyses it again.
    listen(q("fileIn"), "change", e => { const f = e.target.files[0]; e.target.value = ""; analyzeFile(f); });
    listen(sel, "change", () => { if (lastResult) showResults(lastResult, CHECK_PLANS[Number(sel.value)][1]); });
    listen(q("micBtn"), "click", micToggle);
  }

  // ---------- Ear quiz ----------
  const quiz = { target: null, answered: true, right: benchGet("earRight", 0), total: benchGet("earTotal", 0), voices: [], drone: false };
  function quizScore() { q("earScore").textContent = `Score: ${quiz.right} / ${quiz.total}`; benchSet("earRight", quiz.right); benchSet("earTotal", quiz.total); }
  // Only one question sounds at a time: a new question, "Hear again" or a compare note cuts the last one.
  function quizHush() { quiz.voices.forEach(v => v.stop()); quiz.voices = []; }
  function quizPlay() {
    if (quiz.target === null) return;
    quizHush();
    const c = ac(), t = c.currentTime + 0.05;
    const a = makeVoice(hzOf(0), t); a.stop(t + 0.8);
    const b = makeVoice(hzOf(quiz.target), t + 1.0); b.stop(t + 2.2);
    quiz.voices = [a, b];
  }
  function quizNew() {
    const set = BENCH_EAR_LEVELS[q("earLevel").value]; let n;
    do { n = set[Math.floor(Math.random() * set.length)]; } while (set.length > 2 && n === quiz.target && Math.random() < 0.7);
    quiz.target = n; quiz.answered = false; q("earMsg").textContent = "Which note came second?";
    q("earOpts").innerHTML = set.map(s => `<button type="button" class="bb-btn" data-s="${s}">${LETTERS[s]}</button>`).join("");
    q("earOpts").querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => quizAnswer(Number(btn.dataset.s), btn)));
    if (q("earDrone").checked && !tanpura.isOn()) { tanpura.start(); startedTan = true; quiz.drone = true; }
    quizPlay();
  }
  function quizAnswer(s, btn) {
    if (quiz.answered) { quizHush(); quiz.voices = [playNote(s, 0.8)]; return; }
    quiz.answered = true; quiz.total++;
    const ok = s === quiz.target; if (ok) quiz.right++;
    btn.classList.add(ok ? "bb-right" : "bb-wrong");
    if (!ok) { const r = q("earOpts").querySelector(`[data-s="${quiz.target}"]`); if (r) r.classList.add("bb-right"); }
    q("earMsg").textContent = ok ? `Correct: ${NAME[LETTERS[quiz.target]]}.` : `It was ${NAME[LETTERS[quiz.target]]} (${LETTERS[quiz.target]}). Tap any answer to hear and compare it.`;
    quizScore();
    if (opts.onEar) { try { opts.onEar({ level: q("earLevel").value, correct: ok }); } catch (e) { /* ignore */ } }
  }
  if (has("ear")) {
    if (opts.earLevel && BENCH_EAR_LEVELS[opts.earLevel]) q("earLevel").value = String(opts.earLevel);
    listen(q("earNext"), "click", quizNew);
    listen(q("earAgain"), "click", quizPlay);
    listen(q("earReset"), "click", () => { quiz.right = 0; quiz.total = 0; quizScore(); });
    listen(q("earLevel"), "change", () => { quizHush(); q("earOpts").innerHTML = ""; quiz.target = null; quiz.answered = true; q("earMsg").textContent = "Press New question."; });
    listen(q("earDrone"), "change", () => {
      if (q("earDrone").checked) { if (quiz.target !== null && !tanpura.isOn()) { tanpura.start(); startedTan = true; quiz.drone = true; } }
      else if (quiz.drone) { quiz.drone = false; if (tanpura.isOn()) tanpura.stop(); }
    });
    quizScore();
  }

  // ---------- Live exercises (they listen to the real flute) ----------
  const liveWidgets = {};
  function mountTone() {
    if (liveWidgets.tones) liveWidgets.tones.destroy();
    const v = q("toneNote").value;
    liveWidgets.tones = holdMeter({ targets: v === "any" ? null : [Number(v)], seconds: Number(q("toneSecs").value), cents: Number(q("toneCents").value), ghost: opts.ghost || null });
    q("toneHost").replaceChildren(liveWidgets.tones.el);
  }
  if (has("tones")) {
    const sel = q("toneNote");
    for (let s = -5; s <= 17; s++) { const op = document.createElement("option"); op.value = String(s); op.textContent = `${codeOf(s)}  ${NAME[letterOf(s)]}`; sel.appendChild(op); }
    ["toneNote", "toneSecs", "toneCents"].forEach(k => {
      const saved = benchGet("live." + k, null);
      if (saved !== null && [...q(k).options].some(op => op.value === saved)) q(k).value = saved;
      listen(q(k), "change", () => { benchSet("live." + k, q(k).value); mountTone(); });
    });
    mountTone();
  }
  if (has("echo")) { liveWidgets.echo = echoGame({}); q("echoHost").replaceChildren(liveWidgets.echo.el); }
  if (has("rhythm")) { liveWidgets.rhythm = tapGame({ bpm: 72 }); q("tapHost").replaceChildren(liveWidgets.rhythm.el); }

  // ---------- Tabs ----------
  function setTab(name) {
    if (!has(name)) name = tabs.length ? tabs[0][0] : "";
    root.querySelectorAll(".bb-tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
    root.querySelectorAll("[data-panel]").forEach(p => { p.hidden = p.dataset.panel !== name; });
    // Close the microphone (and stop the tap game) when its tab is left.
    for (const [k, w] of Object.entries(liveWidgets)) if (k !== name && w.stop) w.stop();
    if (!compact) benchSet("tab", name);
  }
  root.querySelectorAll(".bb-tabs button").forEach(b => listen(b, "click", () => setTab(b.dataset.tab)));
  if (tabs.length < 2) { const nav = root.querySelector(".bb-tabs"); if (nav) nav.hidden = true; }

  cleanups.push(onSettings(() => { if (!destroyed) { buildChart(); refreshNotation(); } }));

  buildSvg(); buildChart(); buildPresets();
  setTab(opts.tab || (compact ? null : benchGet("tab", null)) || (tabs[0] && tabs[0][0]));

  function stopEverything() {
    stopBlow(); seqStop(); if (has("rhythm")) talaStop(); micOff();
    Object.values(liveWidgets).forEach(w => w.destroy());
    if (startedTan && tanpura.isOn()) tanpura.stop();
    startedTan = false;
  }

  return {
    destroy() {
      if (destroyed) return;
      stopEverything(); destroyed = true;
      cleanups.forEach(fn => { try { fn(); } catch (e) { /* ignore */ } });
      root.remove();
    },
    setTab,
    loadNotation(text, bpm) {
      if (!has("play")) return;
      q("preset").value = "custom"; q("notation").value = text || "";
      if (bpm) q("bpm").value = String(bpm);
      refreshNotation(); setTab("play");
    },
    stopAll: stopEverything
  };
}

mountBench(document.getElementById("bench-root"), {});
})();
</script>
